version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swimlane-app

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      MONGODB_URL: mongodb://mongo:27017/devops

    depends_on:
      - mongo

  mongo:
    image: mongo:6

    container_name: mongo

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
